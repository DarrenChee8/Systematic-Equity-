[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syseq"
version = "0.1.0"
description = "Systematic long-only equity research pipeline: signals, model, portfolio, backtest"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "lxml>=5",
    "requests>=2.31",
    "cvxpy>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
